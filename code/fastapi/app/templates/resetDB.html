<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gantry Robot - Reset Database</title>

  {% include 'partialHTML/head-links.html' %}

</head>

<body class="bg-light px-5">

  <!-- Simple safeguard UI requiring double confirmation before resetting the database. -->
  <main class="container text-center d-flex flex-column justify-content-center align-items-center full-screen">
    <h1 class="mb-4">
      Press this button twice to reset the graph database of the gantry robot:
    </h1>

    <button id="resetBtn" class="btn btn-danger btn-lg p-4">
      RESET GRAPHDB
    </button>

    <p id="status" class="mt-3 text-muted"></p>
  </main>


  <script>
    const API_URL = "{{ url_for('process_request') }}";
    const RESET_CONFIRMATION_TIMEOUT = 5000;

    document.addEventListener("DOMContentLoaded", () => {

      // Centralized element lookups
      const els = {
        resetBtn: document.getElementById("resetBtn"),
        status: document.getElementById("status"),
      };

      let resetPressCount = 0;
      let resetTimeoutId = null;

      function generateCallId() {
        const random = Math.floor(1000 + Math.random() * 9000);
        const timestamp = new Date()
          .toISOString()
          .replace(/[-:.]/g, "-")
          .replace("T", "-")
          .slice(0, 19);

        return `${random}-${timestamp} from ${window.location.href}`;
      }

      // Sends the reset command through the same API contract as the dashboard.
      async function postRequest(functionName, parameters = {}) {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            call_id: generateCallId(),
            function_name: functionName,
            parameters,
          }),
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data?.message || `Request failed with status ${response.status}`);
        }

        return data;
      }

      function setStatus(message = "") {
        els.status.textContent = message;
      }

      function resetConfirmationState() {
        resetPressCount = 0;
        resetTimeoutId = null;
        setStatus();
      }

      async function resetGraphDB() {
        try {
          setStatus("Calling URL...");

          const data = await postRequest("reset_DB");
          setStatus(data?.results?.message || "GraphDB reset completed.");
        } catch (error) {
          console.error(error);
          setStatus(`Error: ${error.message}`);
        }
      }

      // Requires two presses within a short time window to avoid accidental resets.
      function handleResetClick() {
        resetPressCount++;

        if (resetPressCount === 1) {
          setStatus("Press again to confirm...");

          resetTimeoutId = setTimeout(
            resetConfirmationState,
            RESET_CONFIRMATION_TIMEOUT
          );
          return;
        }

        clearTimeout(resetTimeoutId);
        resetPressCount = 0;
        resetGraphDB();
      }

      function setupEventListeners() {
        els.resetBtn.addEventListener("click", handleResetClick);
      }

      setupEventListeners();
    });
  </script>

</body>

</html>
